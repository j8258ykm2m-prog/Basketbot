name: Code checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/basketbot_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: basketbot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d basketbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.12.12

      - name: Check code
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        run: python -m unittest -v test_core test_database_integration

      - name: Compile code
        run: python -m compileall -q .
